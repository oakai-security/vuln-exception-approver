[project]
name = "vuln-exception-approver"
version = "0.1.0"
description = "Deterministic risk governance and vulnerability exception approval micro-agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "requests>=2.34.2",
]

[project.scripts]
vuln-exception-approver = "vuln_exception_approver.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]
